name: Docker

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  IMAGE_NAME: castorice-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      deployments: write

    steps:
    - uses: actions/checkout@v4

    - name: 设置小写镜像名
      run: |
        echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: 提取版本号
      id: meta
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION="${{ github.ref_name }}"
        else
          VERSION="latest"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: 登录 ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 登录 Docker Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 构建并推送镜像
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest
          docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

    - name: 创建 GitHub Deployment
      id: deploy_create
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ENV_NAME="container-publish"
        DESC="Published Docker image to ghcr.io"

        DEPLOY_ID=$(curl -s -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/deployments \
          -d "{\"ref\":\"${{ github.ref_name }}\",\"environment\":\"$ENV_NAME\",\"description\":\"$DESC\",\"required_contexts\":[]}" \
          | jq -r '.id // empty')

        if [ -z "$DEPLOY_ID" ]; then
          echo "Failed to create deployment"
          exit 0
        fi

        echo "deployment_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
        echo "Deployment created: id=$DEPLOY_ID, env=$ENV_NAME"

    - name: 更新 Deployment 状态
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        DEPLOY_ID=${{ steps.deploy_create.outputs.deployment_id }}
        if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
          echo "Skip: no deployment_id"
          exit 0
        fi

        STATUS="${{ job.status }}"
        case "$STATUS" in
          success) DEPLOY_STATUS="success" ;;
          failure) DEPLOY_STATUS="failure" ;;
          *)       DEPLOY_STATUS="error" ;;
        esac

        ENV_URL="https://github.com/${{ github.repository }}/pkgs/container/${{ env.IMAGE_NAME }}"

        curl -s -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses \
          -d "{\"state\":\"$DEPLOY_STATUS\",\"environment_url\":\"$ENV_URL\",\"log_url\":\"$ENV_URL\"}" \
          | jq -r '.id // empty'

        echo "Deployment status set to: $DEPLOY_STATUS"

    - name: 输出拉取命令
      run: |
        echo "✅ 镜像构建成功！"
        echo "📦 ghcr.io 拉取："
        echo "   docker pull ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
        echo "📦 Docker Hub 拉取："
        echo "   docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
