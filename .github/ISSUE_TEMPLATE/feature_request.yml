name: 💡 功能建议
description: 提一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你的问题 / 场景
      description: 你遇到了什么不便？想解决什么问题？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案
      description: 你希望 Castorice Agent 怎么做？
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: 你考虑过的替代方案
      description: 有没有其他做法也能解决？

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
